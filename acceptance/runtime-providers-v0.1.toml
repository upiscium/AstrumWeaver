matrix_version = "v0.1"
scope = "astrumweaver-provider-contract"
description = "Public compatibility claims for first-class AstrumWeaver RuntimeProviders. Validated means covered by automated AstrumWeaver contract tests, not universal upstream hardware/model certification."
