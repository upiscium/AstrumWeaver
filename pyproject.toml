[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astrumweaver"
version = "0.1.0.dev0"
description = "Deployment-agnostic compute fabric for heterogeneous compute nodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
astrumweaver-control = "astrumweaver.control.cli:main"
astrumweaver-worker = "astrumweaver.worker.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astrumweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
