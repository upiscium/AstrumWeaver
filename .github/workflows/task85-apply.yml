name: Task 85 exact patch application
on:
  push:
    branches: [fix/85-worker-heartbeat-liveness]
    paths: [.github/workflows/task85-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'upiscium/AstrumWeaver' && github.ref == 'refs/heads/fix/85-worker-heartbeat-liveness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Validate transport, apply candidate, remove temporary files
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/85-worker-heartbeat-liveness
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.task85-patch-{i}.b64').read_text().strip() for i in (1, 2))
          # Repair one known copy-only duplicated fragment; the exact patch
          # digest and complete candidate tree below remain authoritative.
          encoded = encoded.replace('IPSuLK5SuLK5VQ', 'IPSuLK5VQ')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0ab44538b38d0ed2b563bb84f2efc88e351a7f33c22da441f243213bb7cc9bad'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'task85.patch'
          target.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == {
              '.github/workflows/task85-snapshot.yml',
              'docs/worker-contract.md', 'docs/worker-liveness.md',
              'src/astrumweaver/worker/client.py', 'src/astrumweaver/worker/daemon.py',
              'src/astrumweaver/worker/health.py', 'src/astrumweaver/worker/runtime.py',
              'tests/test_postgres_control_repository.py', 'tests/test_worker_liveness.py',
          }
          subprocess.run(['git', 'apply', '--check', '--index', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          PY
          git rm .task85-patch-1.b64 .task85-patch-2.b64 .github/workflows/task85-apply.yml
          git diff --cached --check
          test "$(git write-tree)" = ef127cd74f2e5870e5c804919b5b84965bd21be8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Maintain Worker liveness and reconcile acknowledged Control state (#85)'
          git push origin "HEAD:refs/heads/$branch"
