name: Task 85 cancellation follow-up
on:
  push:
    branches: [fix/85-worker-heartbeat-liveness]
    paths: [.github/workflows/task85-followup.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'upiscium/AstrumWeaver' && github.ref == 'refs/heads/fix/85-worker-heartbeat-liveness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply exactly reviewed two-file correction
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/85-worker-heartbeat-liveness
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_PARENT"
          printf '%s  %s\n' 62730d1f36634ee2bd9aac97f693de0d8a79b261205d713b59f1d552f0c4ff8b .task85-followup.patch | sha256sum --check
          git apply --check --index .task85-followup.patch
          git apply --index .task85-followup.patch
          git rm .task85-followup.patch .github/workflows/task85-followup.yml
          git diff --cached --check
          test "$(git write-tree)" = f03d12c7031bcbba491aa96ebe3860e791dffc72
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep forced-shutdown executor cancellation single-owned (#85)'
          git push origin "HEAD:refs/heads/$branch"
