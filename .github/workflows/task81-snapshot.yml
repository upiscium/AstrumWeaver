name: Task 81 source snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/task81-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/81-setup-filesystem-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked sources only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/task81-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: task81-source
          path: ${{ runner.temp }}/task81-source.tar
          retention-days: 1
