name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astrum
          POSTGRES_PASSWORD: astrum
          POSTGRES_DB: astrumweaver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrum -d astrumweaver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRUMWEAVER_TEST_DATABASE_URL: postgresql://astrum:astrum@127.0.0.1:5432/astrumweaver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test,postgres]'
      - name: Test
        run: python -m pytest -q

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs
