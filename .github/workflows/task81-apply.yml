name: Apply reviewed task 81 patch
on:
  pull_request:
    paths:
      - '.github/workflows/task81-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/81-setup-filesystem-authority' && github.event.pull_request.head.repo.full_name == 'upiscium/AstrumWeaver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify and apply reviewed bytes
        run: |
          set -euo pipefail
          sha256sum --check <<'HASHES'
          425276e33483bc92dcbbd768da5d9653d61fc3cc2396c0650472f5f6ab8cc680  .github/task81-driver.patch
          3a89e2aef3bdc89a5f4cb658032f39f7b6370ef070865daf8977e619b5bb7341  .github/task81-rest.patch
          0b36545202c0cd45dbf3db1b46b9797626aa52f009b03336ea59de252312ab34  src/astrumweaver/setup/filesystem.py
          4ee6fb27727df3e85af819e95f5343c73a539c08705d9ae3eb4327ed8f87cb68  tests/test_setup_filesystem.py
          HASHES
          git apply --index .github/task81-driver.patch
          git apply --index .github/task81-rest.patch
          test "$(git rev-parse :src/astrumweaver/setup/systemd.py)" = 2cdf3a44834f5e3a21393e2cb5c6f83cc129f1ed
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test filesystem and runtime setup regressions
        run: python -m pytest -q tests/test_setup_filesystem.py tests/test_systemd_runtime_setup.py tests/test_systemd_worker_migration.py tests/test_exllamav3_provider.py
      - name: Publish only to the task branch and remove temporary tooling
        run: |
          set -euo pipefail
          git rm .github/task81-driver.patch .github/task81-rest.patch .github/workflows/task81-apply.yml .github/workflows/task81-snapshot.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden setup authority and verify current prerequisites (#81)'
          git push origin HEAD:refs/heads/fix/81-setup-filesystem-authority
