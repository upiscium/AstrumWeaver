name: Task 83 source snapshot
on:
  push:
    branches: [fix/83-transactional-gpu-ownership]
    paths: [.github/workflows/task83-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export exact public source
        run: |
          git archive --format=tar HEAD > /tmp/task83-source.tar
          git rev-parse HEAD HEAD^{tree} > /tmp/task83-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: task83-source
          path: |
            /tmp/task83-source.tar
            /tmp/task83-identity.txt
          retention-days: 1
