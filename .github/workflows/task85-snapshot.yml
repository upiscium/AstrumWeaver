name: Task 85 source snapshot
on:
  push:
    branches: [fix/85-worker-heartbeat-liveness]
    paths: [.github/workflows/task85-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source and identity
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/task85-identity.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/task85-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: task85-source
          path: |
            ${{ runner.temp }}/task85-source.tar
            ${{ runner.temp }}/task85-identity.txt
          retention-days: 1
