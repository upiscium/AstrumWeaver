name: Task 87 apply reviewed source
on:
  push:
    branches: [fix/87-runtime-health-supervision]
    paths: [.github/workflows/task87-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'upiscium/AstrumWeaver' && github.ref == 'refs/heads/fix/87-runtime-health-supervision'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          data = lzma.decompress(base64.b64decode(Path('.task87.patch.xz.b64').read_bytes()))
          assert hashlib.sha256(data).hexdigest() == 'd23d0290a998cbfabce7c00065f16be11925f630d7090f98901f1be5b2aacc38', 'patch digest mismatch'
          Path(os.environ['RUNNER_TEMP'], 'task87.patch').write_bytes(data)
          PY
          git apply --index --binary "$RUNNER_TEMP/task87.patch"
          git rm .task87.patch.xz.b64 .github/workflows/task87-apply.yml
          test "$(git write-tree)" = d3f3c0f53b681a1fc3b1961b645b2ee0c8c6d3f6
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Supervise owned runtime health and quarantine failed Workers (#87)'
          git push origin HEAD:refs/heads/fix/87-runtime-health-supervision
