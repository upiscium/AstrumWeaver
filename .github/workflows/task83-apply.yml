name: Task 83 exact patch application
on:
  push:
    branches: [fix/83-transactional-gpu-ownership]
    paths: [.github/workflows/task83-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'upiscium/AstrumWeaver' && github.ref == 'refs/heads/fix/83-transactional-gpu-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and apply exact locally tested tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8ffa37ca3c437fa13a5b1e906c377a50561adaf0
          test "$(git ls-remote origin refs/heads/fix/83-transactional-gpu-ownership | cut -f1)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.task83.patch.gz.b64').read_text().strip()
          # Normalize the identified transport transcription before the strict
          # payload hash and complete resulting-tree verification below.
          encoded = encoded.replace('e3McXbyB1B6k7', 'e3McXbyB6k7')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ee879fe71923a44f4e9548f1db76e9838fda0505e5f5f7176107ab11340c462f'
          Path('/tmp/task83.patch').write_bytes(patch)
          PY
          git apply --check /tmp/task83.patch
          git apply /tmp/task83.patch
          rm .task83.patch.gz.b64 .github/workflows/task83-apply.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 36b8fda5ab06e96e74035de8f012e3b418d8bee2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Serialize GPU enrollment and verify concurrent ownership (#83)'
          git push origin HEAD:refs/heads/fix/83-transactional-gpu-ownership
